# US-013: Design Tokens & Theme Specification
# Gerado por: Architecture Agent
# Data: 2026-03-03
# Versão: 1.0.0

## 1. CSS Custom Properties

### Colors (Light Mode)
- Primary: #8B5CF6 (purple), hover, light, dark variants
- Secondary: #10B981 (green), hover, light, dark variants
- Neutral scale: 0-1000 (white to black)
- Semantic: success, warning, error, info
- Surface: background, surface, elevated, overlay
- Text: primary, secondary, tertiary, inverse, link

### Colors (Dark Mode)
- data-theme="dark": inverted neutral scale
- Maintained primary/secondary colors, adjusted hovers
- localStorage persistence with THEME_STORAGE_KEY

### Spacing (4px base grid)
- 0, 1 (4px), 2 (8px), 3 (12px), 4 (16px), 5 (20px), 6 (24px)
- 8 (32px), 10 (40px), 12 (48px), 16 (64px), 20 (80px), 24 (96px)

### Typography (Fluid with clamp())
- Font families: sans (system-ui), mono (monospace)
- Sizes: xs (12-14px), sm (14-16px), base (16-18px), lg, xl, 2xl, 3xl, 4xl
- Weights: normal (400), medium (500), semibold (600), bold (700)
- Line heights: none, tight, snug, normal, relaxed, loose

### Borders & Radius
- Widths: 0, 1px, 2px, 4px
- Radius: none, sm (4px), md (8px), lg (12px), xl (16px), 2xl (24px), full (circle)

### Shadows & Transitions
- Elevations: xs, sm, md, lg, xl, 2xl, focus (2px primary-light)
- Durations: fast (150ms), base (200ms), slow (300ms), slower (500ms)
- Timings: ease-in, ease-out, ease-in-out

### Breakpoints (Mobile-First)
- sm: 360px, md: 768px, lg: 1024px, xl: 1440px
- Use min-width queries only

## 2. Accessibility (WCAG AA)
- Contrast ratios ≥4.5:1 for normal text, ≥3:1 for large text
- Focus outline 2px, focus-visible styles
- Validated color combinations in light and dark modes

## 3. Theme Provider (React Context)
- ThemeContext: { theme, toggleTheme, setTheme }
- localStorage sync, cross-tab updates
- Event: THEME_CHANGED_EVENT

## 4. Validation Rules
- All colors via var() (no hardcoded values)
- Dark mode via data-theme attribute
- Mobile-first breakpoints (min-width)
- Spacing multiples of 4px
- Fluid typography with clamp()

## 5. Dependencies
- PostCSS (custom properties fallback)
- Storybook addon-themes
