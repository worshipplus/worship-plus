name: CI/CD - Worship+ Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20.x'
  WORKING_DIR: './frontend'

jobs:
  # ===========================
  # JOB 1: Code Quality & Lint
  # ===========================
  lint:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      
      - name: 📚 Install dependencies
        run: npm ci
      
      - name: 🔎 Run ESLint
        run: npm run lint
        continue-on-error: false
      
      - name: 💅 Check code formatting (Prettier)
        run: npm run format:check
        continue-on-error: false

  # ===========================
  # JOB 2: Type Checking
  # ===========================
  typecheck:
    name: 🔷 TypeScript Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      
      - name: 📚 Install dependencies
        run: npm ci
      
      - name: 🔷 Run TypeScript compiler
        run: npm run -s tsc:build

  # ===========================
  # JOB 3: Unit & Integration Tests
  # ===========================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      
      - name: 📚 Install dependencies
        run: npm ci
      
      - name: 🧪 Run unit tests
        run: npm run test:unit
      
      - name: 🧪 Run integration tests
        run: npm run test:integration
      
      - name: 📊 Generate coverage report
        run: npm run test:coverage

  # ===========================
  # JOB 4: Build Application
  # ===========================
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      
      - name: 📚 Install dependencies
        run: npm ci
      
      - name: 🏗️ Build for production
        run: npm run -s build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      
      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ${{ env.WORKING_DIR }}/dist/
          retention-days: 7
      
      - name: 📊 Check bundle size
        run: |
          echo "### 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          du -sh dist/* >> $GITHUB_STEP_SUMMARY

  # ===========================
  # JOB 5: E2E Tests (Playwright)
  # ===========================
  e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      
      - name: 📚 Install dependencies
        run: npm ci
      
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ env.WORKING_DIR }}/dist/
      
      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps
      
      - name: 🧪 Run E2E tests
        run: npm run test:e2e
        env:
          CI: true
      
      - name: 📦 Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: ${{ env.WORKING_DIR }}/test-results/
          retention-days: 7

  # ===========================
  # JOB 6: Lighthouse Performance
  # ===========================
  lighthouse:
    name: 🚨 Lighthouse Audit
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci
        working-directory: ${{ env.WORKING_DIR }}
      
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ env.WORKING_DIR }}/dist/
      
      - name: 🚨 Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: './frontend/lighthouse.config.js'

  # ===========================
  # JOB 8: Deploy Production (Vercel)
  # ===========================
  deploy-production:
    name: 🎉 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, test, e2e, lighthouse]
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://worshipplus.app
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: ${{ env.WORKING_DIR }}/dist/
      
      - name: 🚀 Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          working-directory: ${{ env.WORKING_DIR }}

  # ===========================
  # JOB 9: Dependency Security Audit
  # ===========================
  security:
    name: 🔒 Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIR }}
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ${{ env.WORKING_DIR }}/package-lock.json
      
      - name: 📚 Install dependencies
        run: npm ci
      
      - name: 🔒 Run npm audit
        run: npm audit --audit-level=moderate
        continue-on-error: true
